name: Deploy Playground to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "playground/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-playground.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build playground
        run: npx guchho build
        working-directory: playground
        shell: pwsh

      - name: Verify build output
        run: |
          if (!(Test-Path "playground/dist")) {
            Write-Error "Guchho build did not create playground/dist"
            Get-ChildItem -Force playground
            exit 1
          }
        shell: pwsh

      - name: Skip Jekyll processing
        run: New-Item -Path "playground/dist/.nojekyll" -ItemType File -Force
        shell: pwsh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: windows-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4