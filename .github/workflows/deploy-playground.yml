name: Deploy Playground to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "playground/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-playground.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build playground with Guchho
        run: npm run playground:build

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -d playground/dist ]; then
            echo "::error::Guchho build did not create playground/dist"
            echo "Available playground files:"
            ls -la playground
            exit 1
          fi

          if [ ! -f playground/dist/index.html ]; then
            echo "::error::playground/dist/index.html is missing"
            echo "Generated files:"
            find playground/dist -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Build output verified successfully."
          find playground/dist -maxdepth 2 -type f -print

      - name: Skip Jekyll processing
        run: touch playground/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4